# Custom-bot 配置文件
# 版本: 2.0
# 作者: Xinz / ahhhahh（及 AI 助手）

# --- 内核核心配置 ---
kernel:
  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: INFO
  # 框架版本，供「版本」命令与状态页使用
  version: "1.0.0"
  # 全局管理员用户 ID（跨平台通用）；填 "*" 表示所有人都是管理员（仅调试用）
  # !! 务必替换成你自己的实际用户 ID，可先用「id」命令查看 !!
  admins:
    - "10001"
    - "admin_user"
  # 命令前缀；留空字符串表示允许无前缀直接命中命令名
  command_prefixes:
    - "/"
    - "!"
  # 同时处理的消息上限（防止刷屏拖垮内核）
  max_concurrent: 16
  # 状态页保留的最近消息条数
  message_retention: 200
  # 单条命令默认超时（秒）
  plugin_timeout: 15
  # 退出时等待各组件关闭的时间（秒）
  shutdown_timeout: 10

# --- Web 管理界面 ---
webui:
  enabled: true
  host: "0.0.0.0"
  port: 9090
  # 状态推送间隔（秒），范围 1-30
  stats_interval: 5
  title: "Custom-bot 控制台"
  # 登录认证；两项都留空 = 不校验（只建议本机或反代后使用）
  auth:
    username: ""
    password: ""

# --- 数据库 ---
database:
  # 目前实现为 JSON 文件（每个表一个文件），保留 tinydb 名称仅为兼容旧配置
  provider: json
  # 存储目录（相对项目根）
  path: data/db

# --- 日志 ---
logging:
  level: INFO
  dir: data/logs
  file: custom-bot.log
  max_bytes: 5242880
  backup_count: 5
  console: true

# --- 协议适配器 ---
adapters:
  # 反向 WebSocket QQ 适配器（OneBot v11）
  qqbot_reverse_ws:
    enabled: true
    class: Adapter.qq_adapter.QQAdapter
    config:
      host: "0.0.0.0"
      port: 8765
      protocol_name: onebot_rws
      # 必须与 QQ 客户端（NapCat / LLOneBot 等）里配置的反向 WS 地址路径一致
      path: "/onebot/v11/event"
      # access_token: "YOUR_SECRET_TOKEN"
      api_timeout: 30

  # HTTP Webhook（外部系统推事件进来，也可作为出站通知）
  http_webhook:
    enabled: false
    class: Adapter.http_adapter.HttpAdapter
    config:
      host: "0.0.0.0"
      port: 8088
      path: /webhook
      health_path: /health
      protocol_name: http
      # access_token: "YOUR_WEBHOOK_TOKEN"
      # callback_url: "https://example.com/receive"

  # 通用反向 WebSocket（自定义客户端 / 中转程序）
  reverse_ws_example:
    enabled: false
    class: Adapter.reverse_ws_adapter.ReverseWebSocketAdapter
    config:
      host: "0.0.0.0"
      port: 8766
      path: /ws
      protocol_name: reverse_ws
      # access_token: "YOUR_TOKEN"

# --- 处理器 / 插件配置 ---
handlers:
  # 插件 ID 与插件模块里的 NAME 对应；未列出的插件默认启用
  基础命令:
    enabled: true
    config:
      # 插件级管理员（与 kernel.admins 叠加）
      admins: []

# --- 定时任务 ---
scheduled_tasks:
  heartbeat:
    enabled: false
    name: "心跳"
    script_path: "example_task.py"
    schedule: { trigger: "interval", minutes: 30 }
    timeout_seconds: 60
